[project]
name = "mirage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "asciibase64", email = "ilsao@outlook.com" }
]
requires-python = ">=3.14"
dependencies = []

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.scripts]
mirage = "mirage:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pyrefly>=1.5.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
]
